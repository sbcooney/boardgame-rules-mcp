# Official rulebook sources. Links and checksums only — never rulebook content.
#
# SOURCE RULE: only publisher-issued documents (rulebooks, official errata in a
# publisher's rulebook or document). Never community FAQs, wikis or forum posts,
# however reliable: they may point to an official change, but the change goes in
# only once a publisher document states it.
# Publisher documents found only on a community site (e.g. Ravensburger's own
# Villain Guide PDFs uploaded to BoardGameGeek) are allowed as user_supplied:
# never auto-downloaded, `download_page` tells users where to get them, and the
# title says where they came from so citations show it. `source_type: errata` documents can
# `amend` a rulebook section; answers then give both the printed and the changed rule.
#
# extraction hints (from the M0 spike):
#   columns:       text columns per page; extract each separately, or lines
#                  from side-by-side columns get interleaved
#   heading_fonts: font name substrings (with min size) that mark section headings
#   body_fonts:    font name substrings kept as rules text; everything else
#                  (card art, decorative borders, watermarks) is dropped
#   figure_text:   also read text drawn inside embedded graphics (page titles
#                  set that way); each lands before the text below it
#   run_in_headings: a heading that starts a line of body text ("Ally cards
#                  appear ...") also titles a section
#   spreads:       [first, last] PDF pages holding two printed pages side by side
#   printed_page_offset: added to PDF page numbers to give printed ones
#                  (-1 when an unnumbered cover is PDF page 1)
#   page_order:    reading order of PDF pages, for files stored in print
#                  order (a booklet whose cover is PDF page 3)
#   line_margin:   how far apart lines may be and still form one text box
#                  (boxes layout; pdfminer default 0.5)
#   column_continuations: a line left of the current heading's column goes back
#                  to the section headed above it in its own column
#   side_titles:   {pdf page: title} for page titles printed sideways, one
#                  letter per line, which extraction can't read; each starts
#                  a part on that page
#   inline_boxes:  words pdfminer split off a line into their own small text
#                  box (beside inline icons) are merged back into that line
#                  (boxes layout)
#   heading_max_words: heading lines that don't read as a title become body
#                  text: a wrapped run of more words than this (a paragraph
#                  set large), all lowercase, or ending in a full stop. Part
#                  of the default hints for rulebooks users add
#                  (extract.default_hints)
#   table.title_columns: table columns joined into each record's subsection
#                  title (a card's number, name and points)
#
# synonyms: words players use -> the rulebook's own terms. Search also looks
# for the rulebook terms, so "thief" finds robber rules. Built from general
# table talk, not from failing eval questions (see evals/ vocab_holdout).
catan:
  name: Catan
  synonyms:
    thief: [robber]
    bandit: [robber]
    tile: [hex]
    space: [hex, intersection]
    corner: [intersection]
    edge: [path]
    house: [settlement]
    town: [settlement]
    village: [settlement]
    church: [city]  # the components list: cities are "shaped like churches"
    port: [harbor]
    harbor: [port]  # the 2025 edition says port; players of the 2020 edition say harbor
    soldier: [knight]
    biggest: [largest]
    action: [development]
    bank: [supply]
    points: [victory]
    score: [victory]
    vp: [victory]
    disc: [token]
    chip: [token]
    throw: [roll]
    seven: ["7"]
    swap: [trade]
    exchange: [trade]
    water: [coast, sea]
    sand: [desert]
    wood: [lumber]
    sheep: [wool]
    wheat: [grain]
    stone: [ore]
    rock: [ore]
    clay: [brick]
  editions:
    "2020":
      docs:
        - id: rules-almanac
          title: Game Rules & Almanac (3-4 players)
          url: https://www.catan.com/sites/default/files/2021-06/catan_base_rules_2020_200707.pdf
          sha256: 3fed941bf202314ed462d4d0cdfb0384c97fe04166b48a7186833b3f6f4ac024
          extraction:
            columns: 2
            content_pages: [2, 14]  # skip cover, credits, index
            heading_fonts:
              - {name: Garamond-BoldCondensed-SC800, min_size: 12}  # small caps (initials print larger): normalize case
              - {name: Garamond-BoldCondensed, min_size: 13, max_size: 13}  # "The Turn in Detail"; larger = diagram symbols
              - {name: Garamond-BookCondensed, min_size: 13, max_size: 13}  # "4. Special Cases" (regular weight)
            subheadings:  # labelled steps inside a section: "a) Road Requires: ...", "1. Resource Production"
              pattern: '^(?:[a-z]\)|\d+\.)\s'
              fonts: [Garamond-BoldCondensed]
              min_size: 11
              max_size: 12  # body-size labels only; the 25pt "=" in cost diagrams uses this font too
            body_fonts: [Garamond-BookCondensed, Garamond-BoldCondensed]
            body_size: [9, 12.5]  # rules text is 11-12pt; sidebars are 13-17pt, card art under 8pt
          parts:  # top level of each section's path; a part starts at its first heading
            - {name: Game Rules}
            - {name: Almanac, first_heading: Build (Building)}
    "2025":
      docs:
        - id: rulebook
          title: CATAN – The Game Rulebook (3-4 players)
          url: https://www.catan.com/sites/default/files/2025-03/CN3081%20CATAN%E2%80%93The%20Game%20Rulebook%20secure%20%281%29.pdf
          sha256: 0d81a40c1d4eb5eb438a62f80d71cdaab5f00404722c3cfa0b106d79b635ebc6
          extraction:
            layout: boxes
            content_pages: [2, 12]
            heading_fonts:
              - {name: ProximaNova-Bold, min_size: 20.5, max_size: 21.5, part: true}  # page titles: "PRODUCTION PHASE"
              - {name: ProximaNova-Bold, min_size: 13, max_size: 16}  # "RESOLVE A 7", setup steps, "OBJECTIVE"
            subheadings:
              - {fonts: [ProximaNova-Bold], min_size: 11.4, max_size: 11.6}  # "2. ACTIVATE THE ROBBER", "SETTLEMENTS"
              - {pattern: '^The Distance Rule:', fonts: [ProximaNovaCond-BoldIt], min_size: 11.4, max_size: 11.6}  # a sidebar on the Build page
            body_fonts: [ProximaNovaCond, ProximaNova]
            body_size: [9, 13]  # drops card and tile art (under 5pt), the watermark, and the 8.5pt scoring table
            captions:  # "Hills produce brick" labels under the terrain hexes
              - {name: ProximaNovaCond-Bold, min_size: 7.9, max_size: 8.1}
            side_titles: {3: Components, 4: Fixed Setup}
            # Diagram labels ("1 VP each", "2x" under card pictures), and the 13pt
            # flavor line that opens Variable Setup, which would read as a heading.
            skip_text: ['1 VPs?|2 VPs?|each|front|back|[12]x', 'Level up your game!.*']
          # no almanac in this edition; rules differ from 2020 (Production/Action phases)
          # Known gap: page 6's side column (three examples, and the terrain labels) is read
          # after the main column, so it lands in "Activate the Robber" rather than beside
          # the rule each example illustrates. Page citations are still right.

wingspan:
  name: Wingspan
  # Only words the rulebook doesn't already use with another meaning: "move",
  # "score" and "row" are left out (move a cube, score a goal, player-mat rows).
  synonyms:
    # equipment
    tower: [birdfeeder]
    feeder: [birdfeeder]
    dice: [die]
    die: [dice]
    market: [tray, face-up]
    river: [tray, face-up]
    display: [tray, face-up]
    chit: [token]
    # actions and timing
    reroll: [throw]
    reset: [throw, refill]
    refresh: [refill, replenish, restock]
    restock: [refill, replenish]
    stash: [cache, tuck]
    store: [cache]
    hide: [cache, tuck]
    buy: [pay]
    capacity: [limit]
    # scoring and goals
    vp: [point]
    objective: [goal]
    ability: [power]
    zone: [habitat]
    # food names players use
    worm: [invertebrate]
    bug: [invertebrate]
    insect: [invertebrate]
    grain: [seed]
    wheat: [seed]
    berry: [fruit]
    cherry: [fruit]
    mouse: [rodent]
    rat: [rodent]
  # Stonemaier's official resources folder. A shared-folder link can only be
  # downloaded as one large zip, so users fetch the rulebook themselves.
  official_source: https://www.dropbox.com/scl/fo/cfbnrvnwwms1fz7589byc/AI8I9LEYzDESkEkm_s3FhSo?rlkey=cykjw2zk47cehkebrl3a5wl7b&dl=0
  editions:
    "1st":
      docs:
        - id: rulebook
          title: Rulebook (r24)
          source: user_supplied  # WS_Rulebook_r24.pdf in the official folder
          download_page: https://www.dropbox.com/scl/fo/cfbnrvnwwms1fz7589byc/AI8I9LEYzDESkEkm_s3FhSo?rlkey=cykjw2zk47cehkebrl3a5wl7b&dl=0
          expected_sha256: a008c1ad227723ff644bf57ebcd4b55b6a7e586a973904aec046c2f0cb3ee07a
          extraction:
            layout: boxes  # free-form magazine layout: pdfminer text boxes, not fixed columns
            content_pages: [1, 11]  # page 12 is credits
            heading_fonts:
              - {name: ATSMarker, min_size: 29, part: true}  # page titles: "THE FOUR ACTIONS"
              - {name: CardenioModern-Bold, min_size: 19.5, max_size: 20.5}  # "OPTION 1. Play a Bird From Your Hand"
            subheadings:
              - {fonts: [CardenioModern-Bold], min_size: 16.5, max_size: 17.5}  # "When you choose to play a bird, do the following:"
            # Rules text 10-12pt; Cardenio at 12pt labels sidebars ("Designer's Note:").
            # Dropped: bird card text (8.3pt), Latin names, print slug.
            body_fonts: [FuturaPT-Light, FuturaPT-Medium, FuturaPT-LightObl, FuturaPTCond-BookObl, FuturaPTCond-Medium, CardenioModern-Bold]
            body_size: [10, 12.5]
            captions:  # 16pt icon captions name the food types, habitats and nest types
              - {name: CardenioModern-Bold, min_size: 15.5, max_size: 16.5}
        - id: appendix
          title: Appendix (r17)
          source: user_supplied  # WS_Appendix_r17.pdf in the official folder
          download_page: https://www.dropbox.com/scl/fo/cfbnrvnwwms1fz7589byc/AI8I9LEYzDESkEkm_s3FhSo?rlkey=cykjw2zk47cehkebrl3a5wl7b&dl=0
          expected_sha256: ec17130c81b0be52785741cead7131f3f1ddc9f0c4bae7b8d6a56cb197ef5a5c
          extraction:
            # Goal tiles sit side by side (text boxes); bonus cards and bird
            # powers are tables of names beside shared text (read across rows).
            layout:
              - {pages: [2, 3], layout: boxes}
              - {pages: [4, 5], layout: rows}
              - {pages: [6, 12], layout: table}  # bird powers: names | power text | explanation
            table: {column_bounds: [188, 387]}  # the table's column edges (from its divider lines)
            content_pages: [2, 12]  # page 1 is the cover
            heading_fonts:
              - {name: ATSMarker, min_size: 29, part: true}  # page titles: "BIRD POWERS" (repeated: running header)
              - {name: CardenioModern-Bold, min_size: 19.5, max_size: 20.5}  # "Name-Related Bonuses"
            subheadings:
              - {fonts: [CardenioModern-Bold], min_size: 16.5, max_size: 17.5}  # power groups: "Food from the supply"
            # Bird and bonus card names are CardenioModern-Bold 10pt.
            body_fonts: [FuturaPT-Light, FuturaPT-Book, FuturaPT-Medium, FuturaPT-LightObl, FuturaPTCond-BookObl, CardenioModern-Bold]
            body_size: [10, 12.5]

wyrmspan:
  name: Wyrmspan
  editions:
    "1st":
      docs:
        - id: rulebook
          title: Rulebook (r19)
          # Linked as the rulebook download from Stonemaier's rules page
          # (https://stonemaiergames.com/games/wyrmspan/rules-faq/). The link is to their
          # whole folder; this path within it, with dl=1, serves the file itself.
          url: https://www.dropbox.com/scl/fo/ulyfze69rb24tsgip7mn7/h/Wyrmspan/Wyr_Rulebook_r19.pdf?rlkey=ha4lz6kvkwmjaglah0lwtzjto&dl=1
          sha256: 7fbef5edf345343f943d2e9b9aed88aed34088d722522786f62dfc3e2c976702
          extraction:
            # Free-form layout with sidebars, like Wingspan, and a table of guild powers.
            layout:
              - {pages: [2, 12], layout: boxes}
              - {pages: [13, 13], layout: table}  # guild | ability | rules
              - {pages: [14, 16], layout: boxes}
            table: {column_bounds: [201, 352], title_columns: [0]}
            content_pages: [2, 16]  # page 1 is the cover, parts list and contents
            skip_pages: [3]  # a setup diagram: only its letter labels are text
            heading_fonts:
              - {name: Amarante-Regular, min_size: 14.5, max_size: 15.5, part: true}  # "ON YOUR TURN", "EXCAVATE"
              - {name: Amarante-Regular, min_size: 10.9, max_size: 11.1}  # "HATCHLINGS"
            subheadings:
              # "LAY AN EGG OR PAY AN EGG:". Terms set in the same type in the middle of
              # a paragraph or bullet list stay in its text ("NOTE:", "• EGGS:").
              - {pattern: '^[^•]', fonts: [Amarante-Regular], min_size: 8.9, max_size: 9.1}
            skip_text: ['^(DRAGON GUILD TILE|ABILITY|RULES|MEDIUM|LYFL)$']  # the guild table's column titles; a card label
            # Rules text 10pt. Dropped: card and icon text, which is much smaller.
            body_fonts: [AcuminProCond, Amarante-Regular]
            body_size: [8.9, 10.1]

spirit-island:
  name: Spirit Island
  editions:
    "1st":
      docs:
        - id: rulebook
          title: Core Rulebook
          # Linked as "Download here" from Greater Than Games' shop page
          # (https://shop.greaterthangames.com/products/spirit-island);
          # dl=1 makes Dropbox serve the file itself.
          url: https://www.dropbox.com/scl/fi/5wzghwnbsi39msyy6vvox/Spirit-Island-CORE-Rulebook.pdf?rlkey=86i7aofqbzhulezjr7z0ssyff&dl=1
          sha256: 64012c21460d3aee0f5c2c0d1048811a4dd4b4aebd03284ee4706a6a1f8e630e
          extraction:
            layout: boxes  # main rules column with sidebars beside it
            content_pages: [3, 32]
            skip_pages: [24, 25, 26, 27, 29]  # lore and design notes (page 2 contents, page 1 cover)
            heading_fonts:
              - {name: FlingaLingBold, min_size: 30, part: true}  # page titles: "GAME CONCEPTS" (repeat as running headers)
              - {name: ReemKufi-Regular, min_size: 13.5, max_size: 14.5, uppercase: true}  # "INVADER PHASE"; 14pt mixed case is flavor text
            subheadings:
              - {fonts: [FlingaLingBold], min_size: 16.5, max_size: 17.5}  # sidebar titles: "LAND ORDER?"
              - {pattern: '^\d+[a-z]?\.\s+[A-Z][A-Z]', fonts: [ReemKufi-Regular], min_size: 11.5, max_size: 12.5}  # "1. BLIGHTED ISLAND", "3a. RAVAGE"
            # Rules text 12pt, examples 9pt, the difficulty table 10pt. Dropped:
            # map and component labels (FlingaLing), page numbers (20pt).
            body_fonts: [ReemKufi-Regular]
            body_size: [8.5, 12.5]
        - id: nature-incarnate-changes
          title: Nature Incarnate Rulebook (Significant Changes)
          # Official errata: the publisher's Nature Incarnate rulebook (linked as
          # "Download here" from https://shop.greaterthangames.com/products/spirit-island-nature-incarnate)
          # lists changes that apply "whether or not you use any content from it".
          # Only those pages are indexed, so expansion rules never reach core answers.
          source_type: errata
          url: https://www.dropbox.com/scl/fi/h5afz14hti4ldfz69dx7l/SISL-NINC-Rulebook_Web.pdf?rlkey=c8de84rz5wea7xvvsnebgan6s&dl=1
          sha256: 735ed5bedee3081d1ab1f2a4030023ab4b213aea1391cede252a6eb96effbe34
          extraction:
            layout: boxes
            content_pages: [6, 7]  # PDF pages; printed pages 5-6
            printed_page_offset: -1  # the cover isn't numbered: printed page = PDF page - 1
            preamble_heading: Significant Changes  # the page title is drawn as a graphic, not text
            heading_fonts:
              - {name: FlingaLingBold, min_size: 30, part: true}  # "SIGNIFICANT CHANGES"
            subheadings:
              - {pattern: '^[^a-z]{6,}$', fonts: [ReemKufi-Regular], min_size: 11.5, max_size: 12.5}  # "BLIGHT ERRATA"
              - {fonts: [FlingaLingBold], min_size: 16.5, max_size: 17.5}  # sidebar titles
            body_fonts: [ReemKufi-Regular]
            body_size: [8.5, 12.5]
          amends:
            - source_section: Significant Changes > BLIGHT ERRATA
              target_doc: rulebook
              target_section: Game Setup > Invader Board
              summary: >-
                Setup: start with exactly 1 additional Blight on the Blight Card or Blight space. A Healthy
                Island card counts as "2 per player, +1"; without a Blight Card, the Blight space counts as
                "5 per player, +1" (e.g. 1 player: 3 Blight; 4 players: 9). Setup only: nothing changes when
                the Blight Card flips.
              printed_rule: >-
                Core rulebooks printed before the 14th printing (including the PDF indexed here) say to place
                the amount of Blight shown on the card, with no extra Blight.
              included_in: >-
                Published in the Nature Incarnate rulebook, which says it applies whether or not you use any
                Nature Incarnate content; printed in the core rulebook from the 14th printing onward.

