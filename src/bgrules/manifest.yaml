            subheadings:
              - {pattern: '^SET UP$', fonts: [Nobel-Bold], min_size: 10.8, max_size: 11.2}  # same font labels the component pictures
            body_fonts: [Nobel-Regular, Nobel-Bold, Nobel-RegularItalic, Nobel-Book]
            body_size: [8.5, 10.5]

