tzolkin:
  name: "Tzolk'in: The Mayan Calendar"
  # From a development batch of BoardGameGeek Rules-forum threads (see brass-birmingham).
  synonyms:
    wheel: [gear]
    spin: [advance, rotate]
    upgrade: [advance]
  editions:
    "1st":
      docs:
        - id: rulebook
          title: Rulebook
          # Listed on Czech Games Edition's game page (https://www.czechgames.com/games/tzolkin-the-mayan-calendar).
          url: https://filemanager.czechgames.com/storage/files/tzolkin-the-mayan-calendar/rules/TZ_rules_EN_13.pdf
          sha256: df209c48ccb626e330a24d4a36da0af9d8de48b4ebbef244a564e5855fa5874a
          extraction:
            layout: boxes
            figure_text: true  # page titles are drawn as graphics
            line_margin: 1.0  # widely spaced lines; at pdfminer's 0.5 each line is its own box and columns interleave
            content_pages: [2, 16]
            heading_fonts:
              - {name: LithosPro-Black, min_size: 29, part: true}  # "ACTIONS"
              - {name: LithosPro-Black, min_size: 17.5, max_size: 18.5}  # "Chichen Itza"
            subheadings:
              - {fonts: [LithosPro-Black], min_size: 13.5, max_size: 14.5}  # "Begging for Corn"
            body_fonts: [TempusSansITCCZ, LithosPro-Black]
            body_size: [8, 9]

a-feast-for-odin:
  name: A Feast for Odin
  # From a development batch of BoardGameGeek Rules-forum threads (see brass-birmingham).
  synonyms:
    cow: [cattle]
    flip: [turn]
    upgrade: [exchange]
  editions:
    "2nd":
      docs:
        - id: rulebook
          title: Rulebook (2nd edition)
          # Feuerland, the original publisher (https://www.feuerland-spiele.de/en).
          # Its "Almanac" is Viking history, not rules, so it isn't indexed.
          url: https://www.feuerland-spiele.de/fileadmin/game/Ein_Fest_fuer_Odin/ODIN_EN_rules_2nd_Web.pdf
          sha256: e1280d095d2df7da6cb1cfd9cd7c0b7befcce2d8c495e3a541bc9ef64c2d9e36
          extraction:
            layout: boxes
            content_pages: [4, 24]
            heading_fonts:
              - {name: Dolmen-SC700, min_size: 14, max_size: 22, part: true}  # "Course of Play" (small caps)
              - {name: Times-Bold, min_size: 11.5, max_size: 12.5}  # "Phase 9: Feast"
            body_fonts: [Times-Roman, Times-Italic, Times-Bold, Times-BoldItalic]
            body_size: [7.5, 10.5]
        - id: appendix
          title: Appendix
          url: https://www.feuerland-spiele.de/fileadmin/game/Ein_Fest_fuer_Odin/ODIN_EN_Appendix_Web.pdf
          sha256: ae4e6ea6330ff85d9719d6b34ff9a65c91a7d64c0a25b2b2c39d2c2e6e2c2bc3
          extraction:
            # Pages 2-11: the occupation card index, one table row per card.
            layout:
              - {pages: [2, 11], layout: table}
              - {pages: [12, 16], layout: boxes}
            table: {column_bounds: [82, 115, 169, 202, 520], title_columns: [0, 1, 2, 3]}  # Nb | Deck | Name | Points | Description | Type
            content_pages: [2, 16]
            heading_fonts:
              - {name: Times-Bold, min_size: 11.5, max_size: 12.5}  # "2. The Placement Rules"
            body_fonts: [Times-Roman, Times-Italic, Times-Bold, Times-BoldItalic]
            body_size: [8.5, 10.5]

sushi-roll:
  name: Sushi Roll
  editions:
    "1st":
