[project]
name = "boardgame-rules-mcp"
version = "0.3.0"
description = "MCP server that answers board game rules questions from official rulebooks, with exact citations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "board games", "rulebook", "claude", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "mcp>=2.3,<3",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pyobjc-framework-vision>=10 ; sys_platform == 'darwin'",
    "pypdfium2>=4.30",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/sbcooney/boardgame-rules-mcp"
Issues = "https://github.com/sbcooney/boardgame-rules-mcp/issues"

[project.scripts]
bgrules = "bgrules.cli:main"
# The package's own name, so `uvx boardgame-rules-mcp ...` works without --from.
boardgame-rules-mcp = "bgrules.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgrules"]
