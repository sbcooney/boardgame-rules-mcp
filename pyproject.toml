[project]
name = "boardgame-rules-mcp"
version = "0.1.0"
description = "MCP server that answers board game rules questions from official rulebooks, with exact citations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pyobjc-framework-vision>=10 ; sys_platform == 'darwin'",
    "pypdfium2>=4.30",
    "pyyaml>=6.0",
]

[project.scripts]
bgrules = "bgrules.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgrules"]
