# Star Wars Villainous: Power of the Dark Side eval questions.
#
# Same format as catan_2020.yaml: short rulings in our own words, checked
# against the indexed Instructions text, and the sections that settle each one.
# Only the shared rules are indexed; each Villain's cards and guide aren't.
game: star-wars-villainous
edition: "2022"
game_name: "Star Wars Villainous: Power of the Dark Side"
edition_desc: Instructions

core: [
  sw-turn-start, sw-credits, sw-win, sw-hand-size,
  sw-maneuver-anywhere, sw-maneuver-not-play, sw-vanquish-combine, sw-zero-strength, sw-discard-draw,
  sw-vocab-money, sw-na-vader-card,
]

questions:
  # ---- lookup ----------------------------------------------------------
  - id: sw-turn-start
    category: lookup
    question: What happens at the start of each of my turns?
    answer: Take 1 Ambition token from the Chamber.
    sections: ["On Your Turn > Gain 1 Ambition"]
  - id: sw-credits
    category: lookup
    question: What are Credits used for?
    answer: They're the currency, paying the Cost of most cards and of Activated Abilities; the Collect Credits action takes them from the supply.
    sections: ["Types of Actions > Collect Credits"]
  - id: sw-win
    category: lookup
    question: How does the game end?
    answer: As soon as a player fulfils their Villain's Objective, the game ends and they win.
    sections: ["Ending the Game"]
  - id: sw-hand-size
    category: lookup
    question: How many cards do I draw back up to?
    answer: Four (or your maximum allowed hand size), at the end of your turn.
    sections: ["On Your Turn > Draw Cards"]
  - id: sw-deep-space
    category: lookup
    question: Where do Vehicle cards go?
    answer: Deep Space, the right-most area of your Sector.
    sections: ["Overview > DEEP SPACE", "Vehicles"]

  # ---- edge ------------------------------------------------------------
  - id: sw-maneuver-anywhere
    category: edge
    question: When I Maneuver an Ally, does it have to go to an adjacent location?
    answer: No, Maneuver puts a card already in play in any new location in your Sector (Villain side only).
    sections: ["Types of Actions > Maneuver"]
  - id: sw-maneuver-not-play
    category: edge
    question: Does Maneuvering a card trigger its "when played" ability?
    answer: No, Maneuvering is not playing a card.
    sections: ["Types of Actions > Maneuver"]
  - id: sw-maneuver-item
    category: edge
    question: Can I Maneuver an Item attached to an Ally on its own?
    answer: No, but Maneuvering the Ally brings its attached Items along.
    sections: ["Types of Actions > Maneuver"]
  - id: sw-vanquish-combine
    category: edge
    question: Can several Allies combine to Vanquish a Hero?
    answer: Yes, add their Strength; it must equal or exceed the character's, and the Allies used and the Vanquished character are discarded.
    sections: ["Types of Actions > Vanquish"]
  - id: sw-zero-strength
    category: edge
    question: Is an Ally with 0 Strength removed?
    answer: No, it stays and keeps its Abilities; it can join a Vanquish (adding nothing) but is always removed if used.
    sections: ["Playing Cards > Strength > Zero-Strength Allies and Heroes"]
  - id: sw-discard-draw
    category: edge
    question: If I discard cards, do I draw replacements right away?
    answer: No, only at the end of your turn.
    sections: ["Types of Actions > Discard Cards", "On Your Turn > Draw Cards"]
  - id: sw-uncovered
    category: edge
    question: If a blocked action is uncovered during my turn, can I still use it?
    answer: Yes, if your Villain is at that location and it's still your turn.
    sections: ["Ending the Game > Blocked Actions"]
  - id: sw-empty-deck
    category: edge
    question: What if my Villain deck runs out when I need to draw?
    answer: Shuffle your Villain discard pile to form a new deck and continue drawing.
    sections: ["On Your Turn > Draw Cards"]

  # ---- vocab: players' words, not the rulebook's -----------------------
  - id: sw-vocab-money
    category: vocab
    question: How do I get more money?
    answer: The Collect Credits action; Credits are the game's currency.
    sections: ["Types of Actions > Collect Credits"]
  - id: sw-vocab-spaceship
    category: vocab
    question: Where do I put my spaceships?
    answer: Vehicle cards go in Deep Space, the right-most area of your Sector.
    sections: ["Overview > DEEP SPACE", "Vehicles"]

  # ---- not addressed by the Instructions -------------------------------
  - id: sw-na-vader-card
    category: not_addressed
    question: What does Darth Vader's Lightsaber card do?
    answer: null
    sections: []
  - id: sw-na-disney-mix
    category: not_addressed
    question: Can I mix Star Wars villains with my Disney Villainous villains?
    answer: null
    sections: []
