# Catan (2020 "Game Rules & Almanac") eval questions.
#
# Each answer is a short ruling in our own words, checked against the indexed
# rulebook text; `sections` lists every section that settles the question
# (retrieving any one of them counts as a hit). No rulebook text is copied here.
#
# categories:
#   lookup         - direct fact from one entry
#   edge           - rules arguments, exceptions, interactions between rules
#   vocab          - phrased in words the rulebook doesn't use ("thief", "tile")
#   not_addressed  - the rulebook doesn't answer it; correct behaviour is to say so
game: catan
edition: "2020"
game_name: Catan
edition_desc: 5th English edition rules (2020 "Game Rules & Almanac")

# Core subset for routine end-to-end runs (uses Claude subscription usage);
# covers every category. `evals/e2e.py --all` runs everything.
core: [
  vp-to-win, city-cost, discard-nine, road-building,
  dev-card-same-turn, trade-off-turn, robber-desert, longest-road-tie, win-off-turn, special-harbor-other,
  vocab-two-spaces, vocab-thief, vocab-church,
  na-turn-timer, na-take-back,
]

questions:
  # ---- lookup ----------------------------------------------------------
  - id: vp-to-win
    category: lookup
    question: How many victory points do you need to win?
    answer: 10 victory points, reached (or held) during your own turn.
    sections: ["Almanac > Victory Points", "Almanac > Ending the Game", "Game Rules > Ending the Game"]
  - id: city-cost
    category: lookup
    question: What does it cost to build a city?
    answer: 3 ore and 2 grain, and it must upgrade one of your existing settlements.
    sections: ["Game Rules > 3. Build"]
  - id: settlement-cost
    category: lookup
    question: What resources do I need to build a settlement?
    answer: Brick, lumber, wool and grain (one of each).
    sections: ["Game Rules > 3. Build"]
  - id: dev-card-cost
    category: lookup
    question: How much does a development card cost?
    answer: Ore, wool and grain (one of each).
    sections: ["Game Rules > 3. Build"]
  - id: road-cost
    category: lookup
    question: What does a road cost?
    answer: Brick and lumber.
    sections: ["Game Rules > 3. Build"]
  - id: piece-limits
    category: lookup
    question: How many settlements, cities and roads does each player have?
    answer: 5 settlements, 4 cities and 15 roads; you can't build more than your supply.
    sections: ["Almanac > Build (Building)", "Game Rules > 3. Build", "Game Rules > Setting Up the Game"]
  - id: largest-army-count
    category: lookup
    question: How many knights do you need for Largest Army?
    answer: The first player to play 3 knight cards takes it; another player who has played more knights takes it from them.
    sections: ["Almanac > Largest Army", "Almanac > Knight Cards", "Game Rules > 3. Build"]
  - id: longest-road-length
    category: lookup
    question: How long does a road have to be to get the Longest Road card?
    answer: At least 5 continuous road pieces; branches don't count, only the single longest branch.
    sections: ["Almanac > Longest Road", "Game Rules > 3. Build"]
  - id: monopoly
    category: lookup
    question: What does the Monopoly card do?
    answer: You name one resource type and every other player gives you all of their cards of that type.
    sections: ["Almanac > Progress Cards"]
  - id: year-of-plenty
    category: lookup
    question: What does Year of Plenty do, and can I build with the cards right away?
    answer: Take any 2 resource cards from the supply; yes, you may use them to build that same turn.
    sections: ["Almanac > Progress Cards"]
  - id: road-building
    category: lookup
    question: What does the Road Building card let you do?
    answer: Immediately place 2 free roads, following the normal building rules.
    sections: ["Almanac > Progress Cards"]
  - id: discard-nine
    category: lookup
    question: A 7 is rolled and I have 9 resource cards. How many do I discard?
    answer: 4 (half, rounded down). Only players with more than 7 cards discard.
    sections: ["Almanac > Rolling a “7” and Activating the Robber", "Game Rules > 3. Build"]
  - id: most-common-numbers
    category: lookup
    question: Which numbers get rolled most often?
    answer: 6 and 8 (the red numbers, 5 pips each). There is no 7 token.
    sections: ["Almanac > Number Tokens"]
  - id: first-player-variable
    category: lookup
    question: With the variable set-up, who places the first settlement?
    answer: Everyone rolls both dice; the highest roller is the starting player.
    sections: ["Almanac > Round One"]
  - id: starting-resources
    category: lookup
    question: When do you get your starting resources in a variable set-up?
    answer: Right after placing your second settlement, one card for each terrain hex adjacent to it.
    sections: ["Almanac > Round Two"]

  # ---- edge ------------------------------------------------------------
  - id: dev-card-same-turn
    category: edge
    question: Can I play a development card on the same turn I bought it?
    answer: No, except a victory point card that brings you to 10 points (VP cards can be revealed the turn you buy them).
    sections: ["Almanac > Development Cards", "Game Rules > 3. Build"]
  - id: knight-before-roll
    category: edge
    question: Can I play a knight card before I roll the dice?
    answer: Yes, a development card can be played at any time during your turn, even before rolling.
    sections: ["Almanac > Development Cards"]
  - id: two-dev-cards
    category: edge
    question: Can I play two knight cards in the same turn?
    answer: No, only 1 development card (a knight or a progress card) per turn.
    sections: ["Almanac > Development Cards", "Almanac > Progress Cards", "Game Rules > 3. Build"]
  - id: trade-off-turn
    category: edge
    question: Can two other players trade with each other while it's my turn?
    answer: No, every trade must involve the player whose turn it is.
    sections: ["Almanac > Domestic Trade", "Almanac > Resource Trade", "Game Rules > 2. Trade", "Almanac > Trade"]
  - id: trade-dev-cards
    category: edge
    question: Can I trade a development card to another player?
    answer: No, development cards can't be traded or given away.
    sections: ["Almanac > Trade", "Almanac > Development Cards"]
  - id: gift-cards
    category: edge
    question: Can I give a resource card to another player for free?
    answer: No, you may not give away cards.
    sections: ["Almanac > Trade", "Almanac > Domestic Trade"]
  - id: like-for-like
    category: edge
    question: Can I trade 2 wool to someone for 1 wool?
    answer: No, you can't trade matching resources.
    sections: ["Almanac > Trade", "Almanac > Domestic Trade"]
  - id: robber-stay
    category: edge
    question: When I roll a 7, can I leave the robber where it is?
    answer: No, the robber must be moved to a different hex.
    sections: ["Almanac > Rolling a “7” and Activating the Robber", "Almanac > Knight Cards"]
  - id: robber-desert
    category: edge
    question: Can the robber be moved back to the desert?
    answer: Yes, it can go on any other terrain hex's number token or on the desert.
    sections: ["Almanac > Rolling a “7” and Activating the Robber", "Almanac > Knight Cards", "Game Rules > 3. Build"]
  - id: break-longest-road
    category: edge
    question: Can I break someone's longest road?
    answer: Yes, by building a settlement on an unoccupied intersection along their road, which splits it.
    sections: ["Almanac > Longest Road"]
  - id: longest-road-tie
    category: edge
    question: My longest road got broken and now two other players are tied for longest. Who gets the card?
    answer: Nobody; set the card aside until a single player has the longest road (5+ pieces). If you are still tied for longest, you keep it.
    sections: ["Almanac > Longest Road"]
  - id: win-off-turn
    category: edge
    question: If I reach 10 points during someone else's turn, do I win right away?
    answer: No, you can only win on your own turn; you claim victory on your next turn.
    sections: ["Almanac > Ending the Game", "Game Rules > Ending the Game"]
  - id: bank-shortage
    category: edge
    question: What happens if the bank runs out of a resource when several players should receive it?
    answer: Nobody receives that resource that turn, unless the shortage only affects one player, who gets whatever is left.
    sections: ["Almanac > Resource Production", "Game Rules > The Turn in Detail"]
  - id: four-to-one-no-harbor
    category: edge
    question: Do I need a harbor to trade with the bank?
    answer: No, the 4:1 trade is always available; harbors give better rates (3:1 or 2:1).
    sections: ["Almanac > Maritime Trade", "Game Rules > 2. Trade"]
  - id: special-harbor-other
    category: edge
    question: I have a settlement on the 2:1 ore harbor. Can I trade wool at 3:1 there?
    answer: No, a special harbor only improves the rate for its own resource; other resources stay at 4:1.
    sections: ["Almanac > Maritime Trade"]
  - id: harbor-same-turn
    category: edge
    question: Can I use a harbor on the same turn I build a settlement on it?
    answer: Only with the Combined Trade/Build Phase variant (recommended for experienced players); in the basic turn order, trading comes before building.
    sections: ["Almanac > Combined Trade/Build Phase"]
  - id: steal-empty-hand
    category: edge
    question: If I move the robber next to a player who has no cards, what do I steal?
    answer: Nothing.
    sections: ["Almanac > Knight Cards"]
  - id: second-settlement-connect
    category: edge
    question: Does my second starting settlement have to connect to my first one?
    answer: No, it can go on any unoccupied intersection that satisfies the Distance Rule.
    sections: ["Almanac > Round Two"]
  - id: roads-vp
    category: edge
    question: Are roads worth victory points?
    answer: Only through the Longest Road card (2 VP).
    sections: ["Almanac > Roads", "Almanac > Victory Points"]
  - id: city-directly
    category: edge
    question: Can I build a city on an empty intersection?
    answer: No, a city can only be made by upgrading one of your settlements.
    sections: ["Almanac > Cities", "Game Rules > 3. Build"]
  - id: sixth-settlement
    category: edge
    question: All 5 of my settlements are on the board. Can I build another one?
    answer: Not until you upgrade one to a city, which returns that settlement piece to your supply.
    sections: ["Almanac > Settlements", "Almanac > Cities"]
  - id: ask-card-count
    category: edge
    question: Do players have to tell me how many cards they're holding?
    answer: Yes, you can always ask and they must answer truthfully.
    sections: ["Almanac > Knight Cards"]

  # ---- vocab -----------------------------------------------------------
  - id: vocab-two-spaces
    category: vocab
    question: Can I build a settlement two spaces away from a city?
    answer: Only if all 3 intersections adjacent to the spot are empty (the Distance Rule); a spot next to the city's corner is illegal.
    sections: ["Almanac > Distance Rule", "Game Rules > 3. Build", "Almanac > Settlements"]
  - id: vocab-thief
    category: vocab
    question: Is the thief allowed to stay on the same tile?
    answer: No, the robber must be moved to a different hex.
    sections: ["Almanac > Rolling a “7” and Activating the Robber"]
  - id: vocab-church
    category: vocab
    question: How many cards does a church collect when its number comes up?
    answer: The church-shaped piece is a city; it produces 2 resource cards.
    sections: ["Almanac > Cities", "Game Rules > 3. Build", "Almanac > Resource Production"]
  - id: vocab-robbed-empty
    category: vocab
    question: What do I get if I rob someone whose hand is empty?
    answer: Nothing.
    sections: ["Almanac > Knight Cards"]
  - id: vocab-points-win
    category: vocab
    question: What score ends the game?
    answer: 10 victory points on your own turn.
    sections: ["Almanac > Victory Points", "Almanac > Ending the Game", "Game Rules > Ending the Game"]

  # ---- vocab_holdout -----------------------------------------------------
  # Written 2026-10-13 BEFORE the synonym list existed, and never used to build
  # it. If synonyms help these as much as the `vocab` set, the gain is real.
  - id: holdout-bandit-desert
    category: vocab_holdout
    question: Am I allowed to put the bandit on the desert?
    answer: Yes, the robber can be moved to any other terrain hex's number token or to the desert.
    sections: ["Almanac > Rolling a “7” and Activating the Robber", "Almanac > Knight Cards", "Game Rules > 3. Build"]
  - id: holdout-town-cards
    category: vocab_holdout
    question: How many cards does a town get when its number is rolled?
    answer: A settlement produces 1 resource card per adjacent producing hex (a city produces 2).
    sections: ["Almanac > Resource Production", "Game Rules > The Turn in Detail", "Game Rules > 3. Build", "Almanac > Settlements"]
  - id: holdout-port-rate
    category: vocab_holdout
    question: Can I swap 3 cards for 1 at a port?
    answer: Yes, if you have a settlement or city on a generic (3:1) harbor; a 2:1 special harbor only covers its own resource.
    sections: ["Almanac > Maritime Trade", "Game Rules > 2. Trade", "Almanac > Harbors"]
  - id: holdout-big-hand
    category: vocab_holdout
    question: What happens to a player with a huge hand when someone throws a seven?
    answer: Anyone holding more than 7 resource cards discards half of them, rounded down.
    sections: ["Almanac > Rolling a “7” and Activating the Robber", "Game Rules > 3. Build"]
  - id: holdout-house-adjacent
    category: vocab_holdout
    question: Can I put a house on the corner right next to another house?
    answer: No, the Distance Rule requires all 3 adjacent intersections to be empty.
    sections: ["Almanac > Distance Rule", "Game Rules > 3. Build", "Almanac > Settlements"]
  - id: holdout-soldiers-army
    category: vocab_holdout
    question: How many soldiers do I need to play to get the biggest army bonus?
    answer: 3 knight cards for Largest Army (worth 2 VP); someone who plays more takes it.
    sections: ["Almanac > Largest Army", "Almanac > Knight Cards", "Almanac > Soldier Cards", "Game Rules > 3. Build"]
  - id: holdout-action-card
    category: vocab_holdout
    question: Can I use an action card the moment I buy it?
    answer: No, a development card can't be played the turn it was bought, except a victory point card that wins the game.
    sections: ["Almanac > Development Cards", "Game Rules > 3. Build"]
  - id: holdout-road-water
    category: vocab_holdout
    question: Can roads go along the water's edge?
    answer: Yes, roads can be built along the coast.
    sections: ["Almanac > Roads", "Almanac > Coast"]
  - id: holdout-desert-corner
    category: vocab_holdout
    question: Does a village next to the sand tile ever collect anything from it?
    answer: No, the desert is the only hex that produces no resources.
    sections: ["Almanac > Desert"]
  - id: holdout-dots
    category: vocab_holdout
    question: What do the little dots under the numbers on the discs mean?
    answer: They show how likely the number is to be rolled; more dots means rolled more often (6 and 8 have 5).
    sections: ["Almanac > Number Tokens"]

  # ---- independent -------------------------------------------------------
  # Written by a Catan player (the project owner) without seeing the synonym
  # list (M6). Wording is theirs, verbatim; rulings checked against the rulebook.
  - id: user-who-goes-first
    category: independent
    question: Who goes first in Catan?
    answer: With the beginners' set-up, the oldest player; with the variable set-up, everyone rolls both dice and the highest roller starts.
    sections: ["Game Rules > Turn Overview", "Almanac > Starting Set-Up for Beginners", "Almanac > Round One"]
  - id: user-deal-cards
    category: independent
    question: How many cards do I deal out in Catan?
    answer: None are dealt. Resource cards sit in face-up stacks and development cards in a face-down deck; each player starts with resource cards from the hexes around a starting settlement (the starred one in the beginners' set-up, the second one in the variable set-up).
    sections: ["Game Rules > Setting Up the Game", "Almanac > Starting Set-Up for Beginners", "Almanac > Round Two", "Almanac > Set-Up Phase"]
  - id: user-must-steal
    category: independent
    question: Do I have to steal a card from someone when I roll a 7 in Catan?
    answer: Stealing 1 random card from a player with a settlement or city next to the robber's new hex is a step of the procedure (the rules don't offer it as optional); if no one is adjacent or they have no cards, you get nothing.
    sections: ["Almanac > Rolling a “7” and Activating the Robber", "Game Rules > 3. Build", "Almanac > Knight Cards"]
  - id: user-settlement-cost
    category: independent
    question: What does it cost to build a settlement in Catan?
    answer: Brick, lumber, wool and grain (one of each).
    sections: ["Game Rules > 3. Build"]
  - id: user-how-end
    category: independent
    question: How does catan end?
    answer: When a player has 10 or more victory points during their own turn, they win and the game ends.
    sections: ["Almanac > Ending the Game", "Game Rules > Ending the Game", "Almanac > Victory Points"]

