# Sushi Roll eval questions.
#
# Same format as catan_2020.yaml: short rulings in our own words, checked
# against the indexed rulebook text, and the sections that settle each one.
# Sushi Roll has no synonym list, so `vocab` is untouched by one. `bgg`
# questions are real players' questions from BoardGameGeek's Rules forum.
game: sushi-roll
edition: "1st"
game_name: Sushi Roll
edition_desc: Rules of Play

core: [
  sr-rounds, sr-dice-4p, sr-first-player, sr-sashimi,
  sr-swap-tray, sr-nigiri-wasabi, sr-pudding-2p, sr-tie-break, sr-leftover-tokens,
  sr-vocab-steal, sr-na-timer,
]

questions:
  # ---- lookup ----------------------------------------------------------
  - id: sr-rounds
    category: lookup
    question: How many rounds are there?
    answer: 3.
    sections: ["Overview", "Ending the Game"]
  - id: sr-dice-4p
    category: lookup
    question: How many dice does each player get in a 4-player game?
    answer: 6 (8 with 2 players, 7 with 3, 5 with 5).
    sections: ["Set Up"]
  - id: sr-start-tokens
    category: lookup
    question: What tokens does each player start with?
    answer: 2 chopsticks and 3 menu tokens.
    sections: ["Set Up"]
  - id: sr-first-player
    category: lookup
    question: Who goes first?
    answer: The player with the red-bordered conveyor belt; play then moves left.
    sections: ["Everybody Takes a Turn"]
  - id: sr-maki
    category: lookup
    question: How are maki rolls scored?
    answer: Most maki roll icons scores 6, second most scores 3; tied players all get the full points.
    sections: ["Scoring a Round"]
  - id: sr-sashimi
    category: lookup
    question: How many points are 3 sashimi worth?
    answer: 13 (1 sashimi scores 0, 2 score 6).
    sections: ["Scoring a Round"]

  # ---- edge ------------------------------------------------------------
  - id: sr-swap-tray
    category: edge
    question: Can I use chopsticks to take a die from another player's tray?
    answer: No. Chopsticks swap one die on your conveyor belt with one on another player's conveyor belt; you may never swap dice in a tray.
    sections: ["Everybody Takes a Turn"]
  - id: sr-menu-twice
    category: edge
    question: Can I use more than one menu token on the same turn?
    answer: Yes, menus and chopsticks can be used any number of times in any order, as long as you have tokens to spend.
    sections: ["Everybody Takes a Turn"]
  - id: sr-nigiri-wasabi
    category: edge
    question: What happens if I take a nigiri die when I already have a wasabi?
    answer: The nigiri must go on top of the wasabi die (only 1 nigiri per wasabi), and it scores triple.
    sections: ["Everybody Takes a Turn", "Scoring a Round"]
  - id: sr-wasabi-alone
    category: edge
    question: Does a wasabi with no nigiri on it score anything?
    answer: No.
    sections: ["Scoring a Round"]
  - id: sr-pudding-2p
    category: edge
    question: In a 2-player game, does the player with fewer puddings lose 6 points?
    answer: No, that penalty doesn't apply with 2 players.
    sections: ["Ending the Game"]
  - id: sr-pudding-tie
    category: edge
    question: If two players tie for the most pudding, how many points do they get?
    answer: Both get the full 6 points.
    sections: ["Ending the Game"]
  - id: sr-tie-break
    category: edge
    question: Who wins if players are tied on points?
    answer: The tied player with the most pudding tokens.
    sections: ["Ending the Game"]
  - id: sr-leftover-tokens
    category: edge
    question: Are unused menu and chopsticks tokens worth anything at the end?
    answer: 1 point for every set of 2 unused menu and/or chopsticks tokens (any combination).
    sections: ["Ending the Game", "Scoring a Round"]
  - id: sr-3p-belts
    category: edge
    question: Do the conveyor belts move between rounds?
    answer: Only in a 3-player game, where everyone slides their belt left at the end of the round; otherwise they stay put.
    sections: ["Starting a New Round"]
  - id: sr-token-limit
    category: edge
    question: Is there a limit to how many tokens I can hold?
    answer: No; if a type runs out, take what's available.
    sections: ["Everybody Takes a Turn"]

  # ---- vocab: players' words, not the rulebook's -----------------------
  - id: sr-vocab-steal
    category: vocab
    question: Can I steal a die from someone else's belt?
    answer: With a chopsticks token you can swap 1 die on your belt with 1 on another player's belt, without changing either face.
    sections: ["Everybody Takes a Turn"]
  - id: sr-vocab-reroll
    category: vocab
    question: Is there a way to reroll dice I don't like?
    answer: Spend a menu token to re-roll any number of dice on your conveyor belt.
    sections: ["Everybody Takes a Turn"]

  # ---- bgg: real players' questions from BoardGameGeek's Rules forum ----
  # Wording kept close to the thread title or opening post (thread id in the
  # question id). Expected answers come from the rulebook text, not the replies.
  - id: sr-bgg-2202569
    category: bgg
    question: Is there a limit to the pudding tokens, or can we use a proxy?
    answer: There's no limit to how many tokens you may have; if a type runs out, take what's available.
    sections: ["Everybody Takes a Turn"]
  - id: sr-bgg-2198344
    category: bgg
    question: Can a player use chopsticks to swap back the same die that was just swapped away from them?
    answer: The rules allow swapping any 1 die on another player's conveyor belt for any 1 on yours, with no exception for a die just swapped; dice in a tray can never be swapped.
    sections: ["Everybody Takes a Turn"]
  - id: sr-bgg-2195238
    category: bgg
    question: Does the wasabi have to come before the nigiri, or can you get them in any order?
    answer: Wasabi first; a nigiri taken when you already have a wasabi must go on it (and is tripled). A wasabi without a nigiri on it scores nothing.
    sections: ["Everybody Takes a Turn", "Scoring a Round"]
  - id: sr-bgg-2433438
    category: bgg
    question: Can players take more of one kind of sushi than the spaces shown on the tray?
    answer: Yes; the tray shows a guide to the dice sides and scoring, not a limit.
    sections: ["Set Up", "Scoring a Round"]
  - id: sr-bgg-2208569
    category: bgg
    question: Do you keep your unused menu and chopsticks tokens between rounds?
    answer: Yes; they only score at the end of the game, 1 point per set of 2 unused tokens.
    sections: ["Ending the Game", "Scoring a Round"]
  - id: sr-bgg-2549519
    category: bgg
    question: Why do conveyor belts slide left at the end of the round only in a 3 player game?
    answer: In a 3-player game only, sliding the belts at the end of the round makes sure the start player changes for the next round.
    sections: ["Starting a New Round"]
  - id: sr-bgg-2496925
    category: bgg
    question: If one player has 6 maki rolls and the other has none, does the player with none get the 3 points for second?
    answer: No; only players with maki rolls compare.
    sections: ["Scoring a Round"]
  - id: sr-bgg-2315460
    category: bgg
    question: If one player has 6 puddings and two others both have 3, do the two players with 3 each lose 6 points?
    answer: Yes; players tied for fewest each lose the full 6 (except in a 2-player game).
    sections: ["Ending the Game"]
  - id: sr-bgg-2401291
    category: bgg
    question: When I receive the dice from the player on my right, do we re-roll them?
    answer: Yes, all players re-roll all the dice just passed to them.
    sections: ["Slide and Roll!"]
  - id: sr-bgg-2216856
    category: bgg
    question: Can other players swap dice that are on my tray?
    answer: No, dice in another player's tray can never be swapped.
    sections: ["Everybody Takes a Turn"]

  # ---- not addressed by the rulebook -----------------------------------
  - id: sr-na-timer
    category: not_addressed
    question: Is there a time limit for choosing which die to keep?
    answer: null
    sections: []
  - id: sr-na-dropped-die
    category: not_addressed
    question: What happens if a die falls off the table when rolling?
    answer: null
    sections: []
